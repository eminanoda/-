name: surgery_memo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  cupertino_icons: ^1.0.8
  path_provider: ^2.0.0
  audioplayers: ^5.2.0
  http: ^1.2.0
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  file_picker: ^11.0.2
  record: ^6.2.0
  speech_to_text: ^7.4.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons: # dart run flutter_launcher_icons
  android: true
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon.png"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
